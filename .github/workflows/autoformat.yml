name: Auto-format (one-shot)
on:
  push:
    branches: [feat/fill-incomplete-modules]

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: archlinux:base-devel
    # Skip if the last commit was made by the bot (prevents infinite loop)
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    permissions:
      contents: write
    steps:
      - name: Export GitHub Actions cache env
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install git + toolchain
        run: pacman -Syu --noconfirm --needed git ca-certificates clang lld llvm cmake ninja curl zip unzip tar pkgconf

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: '9e593bb18ea69cc5095e012465dcd675a822ed0d'

      - name: Configure
        env:
          CC: clang
          CXX: clang++
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset clang-relwithdebinfo

      - name: Format (in-place)
        run: cmake --build --preset clang-relwithdebinfo --target format

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "style: auto-format with Arch clang-format"
            git push
          fi
